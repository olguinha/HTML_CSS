<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>

    <form action="cadastro.php" method="get" autocomplete="on">

        <p>
            <label for="iset">Estado</label>
            <select name="estado" id="iset">

                <option value="" selected> escolha apenas 1</option>
                    <optgroup value="federais">
                        <option value="MG">Minas Gerais</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="SP">são Paulo</option>
                        <option value="RJ" selected>Rio de Janeiro</option>
                    </optgroup>
            

                 
                    <optgroup value="regionais">
                        <option value="MG">Minas Gerais</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="SP">são Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                    </optgroup>    
               </select>
        </p>

            <p>
                <label for="iprof">Profissão:</label>
                <input type="text" name="profissão" id="iprof" list="Istprof">
                <datalist id="Istprof">
                    <option value="ADM">Adiministrador</option>
                    <option value="CONT">Contabilista</option>
                    <option value="DEV">Desenvolvedor</option>
                    <option value="PROF">Professor</option>
                </datalist>
            </p>

        <p>
            <label for="ismg">Mensagem:</label> </br>
            <textarea name="msg" id="imsg" cols="30" rows="10"></textarea>
        </p>


        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
