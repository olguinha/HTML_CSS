<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>

    <h1>Exemplo de formulário</h1>


    <form action="cadastro.php" method="get" autocomplete="on">

        <fieldset>
            <legend>Sexo</legend>
             <input type="radio" name="sx" id="isxmas" value="Masculino"><label for="isxmas">Masculino</label>
             <input type="radio" name="sx" id="isxfem" value="Femino"><label for="isxfem">Femino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="esfut" id="iesfut"> <label for="iesfut">Futebol</label> <br>
            <input type="checkbox" name="esnata" id="iesnat"> Natação<br>
            <input type="checkbox" name="esbas" id="iesbas"> Basquete <br>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
             <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
