<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas e mesclagem de celula</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Mesclagem de célula</h1>

<table>
    <tr>
        <td>A</td>
        <td colspan="2">B</td>
        
    </tr>

    <tr>
        <td rowspan="3">D</td>
        <td>E</td>
        <td>F</td>
    </tr>

    <tr>
        
        <td>H</td>
        <td rowspan="2">I</td>
    </tr>

    <tr>
        
        
        <td>L</td>
    </tr>

    <tr>
        <td>M</td>
        <td colspan="2">N</td>
      
    </tr>
    
</table>
    
</body>
</html>
